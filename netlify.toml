# Netlify configuration for the live RDT dashboard.
#
# There is no build step: public/index.html is generated locally by
# build_site.py and committed, so Netlify only has to publish it and bundle the
# function.
#
# The site is also deployable to Cloudflare Pages, which reads functions/ and
# needs no config file of its own - see CLOUDFLARE.md.

[build]
  publish  = "public"
  functions = "netlify/functions"
  command  = ""

[functions]
  # ESM + top-level await in the function and its imported lib/
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
