name: Build RDT dashboard

on:
  schedule:
    # Every 5 minutes - the shortest interval GitHub Actions accepts.
    # In practice runs are often late and some are skipped when GitHub is busy;
    # treat this as "a few times an hour", not a guarantee. See the notes in
    # DEPLOY.md if the dashboard starts lagging or Pages deploys get throttled.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # adds a "Run workflow" button you can press any time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      # Deliberately before the build: if the XLSForm and the scoring script
      # ever drift apart, fail loudly rather than publish a dashboard that
      # mislabels results.
      - name: Check the form and script still agree
        run: python verify_form_sync.py CNM_RDT_PrePostTest_KoboXLSForm_v3.xlsx

      - name: Build the dashboard from Kobo
        env:
          KOBO_SERVER: ${{ secrets.KOBO_SERVER }}
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
        run: python fetch_rdt_results.py

      - name: Stage the site
        run: |
          mkdir -p _site
          cp CNM_RDT_Dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
