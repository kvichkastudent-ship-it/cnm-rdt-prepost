name: Build RDT dashboard

# The schedule is deliberately switched off. This workflow publishes to GitHub
# Pages, and THIS REPOSITORY IS PUBLIC, so every run put all 130-odd individual
# submissions - province, OD, health centre, position, every answer - on an open
# URL. The live dashboard now runs on Cloudflare Pages instead (see
# CLOUDFLARE.md), where the data is fetched per request and never committed.
#
# Kept as a manual button so the Pages route still works if Cloudflare is ever
# unavailable. Read the warning above before pressing it.
on:
  workflow_dispatch:        # "Run workflow" button, nothing automatic

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      # Deliberately before the build: if the XLSForm and the scoring script
      # ever drift apart, fail loudly rather than publish a dashboard that
      # mislabels results.
      - name: Check the form and script still agree
        run: python verify_form_sync.py CNM_RDT_PrePostTest_KoboXLSForm_v5.xlsx

      - name: Build the dashboard from Kobo
        env:
          KOBO_SERVER: ${{ secrets.KOBO_SERVER }}
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
        run: python fetch_rdt_results.py

      - name: Stage the site
        run: |
          mkdir -p _site
          cp CNM_RDT_Dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
