# Cloudflare Workers deployment (the "Create an app" / `npx wrangler deploy` flow).
#
# Two things get published together:
#   [assets]  public/  - the dashboard page, served straight from the edge
#   main      worker.js - answers /api/data, the one request that needs a secret
#
# Assets win when a path matches a file, so only /api/data ever reaches the
# Worker. There is no build step: public/index.html is generated locally by
# build_site.py and committed.
#
# KOBO_SERVER and KOBO_ASSET_UID are plain identifiers and live in [vars] below.
# The TOKEN is not here and never will be: a token in a committed file is a
# leaked token. Set it once with
#     npx wrangler secret put KOBO_API_TOKEN
# which prompts for the value and stores it encrypted on Cloudflare, or add it
# in the dashboard under Settings -> Variables and Secrets as a Secret.
#
# Cloudflare Pages (functions/api/data.js) still works too; see CLOUDFLARE.md.

name = "cnm-rdt-prepost"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"

[vars]
# Not secrets - an identifier and a hostname. The token is set separately.
# Use eu.kobotoolbox.org or kf.kobotoolbox.org to match your own Kobo login;
# a token issued by one returns nothing on the other, and it fails quietly.
KOBO_SERVER = "https://eu.kobotoolbox.org"
KOBO_ASSET_UID = "aRAkKsGrthphw4Nqd7egNY"
